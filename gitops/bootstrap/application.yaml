apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebpf-security-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/callmelyrik-a11y/k8s-ebpf-security-platform.git
    targetRevision: main
    path: gitops/environments/local
  destination:
    server: https://kubernetes.default.svc
    namespace: security-platform
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
